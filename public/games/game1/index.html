<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game</title>
    <style>
      body { margin: 0; width: 960px; height: 600px; overflow: hidden; font-family: system-ui, sans-serif; background: #0b1022; color: #fff; }
      .wrap { width: 100%; height: 100%; display: grid; place-items: center; }
      button { border: none; border-radius: 999px; padding: 12px 20px; font-size: 18px; background: #e8420a; color: #fff; }
      p { margin-top: 10px; opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div style="text-align:center">
        <button id="tap">Tap to Score: 0</button>
        <p>Simple playable placeholder game.</p>
      </div>
    </div>
    <script>
      const button = document.getElementById('tap')
      let score = 0
      button.addEventListener('click', () => {
        score += 1
        button.textContent = `Tap to Score: ${score}`
      })
    </script>
  </body>
</html>
